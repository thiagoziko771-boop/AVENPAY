<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carregando...</title>
</head>
<body>
<script>
(function() {
  function isMobile() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  }
  if (!isMobile()) {
    alert("Clique em Ok para ir para o site.");
    window.location.href = "https://www.gov.br/pf/pt-br";
  }
  document.addEventListener("keydown", function(event) {
    if (event.key === "F12" || (event.ctrlKey && event.shiftKey && event.key === "I")) {
      event.preventDefault();
      alert("Acesso negado às ferramentas de desenvolvedor!");
      window.location.href = "https://autoescolas.com.br/ba";
    }
  });
  document.addEventListener("contextmenu", function(event) {
    event.preventDefault();
    alert("Botão direito desativado!");
  });
})();
</script>
</body>
</html>
