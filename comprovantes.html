<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Comprovantes</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:20px;margin:0}
h1{color:#00ff88;margin-bottom:20px;font-size:18px}
input{padding:8px 12px;background:#222;border:1px solid #444;color:#eee;border-radius:4px;font-family:monospace;width:260px;margin-bottom:16px}
input:focus{outline:none;border-color:#00ff88}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;text-align:left;color:#888;font-size:11px;text-transform:uppercase;border-bottom:1px solid #333;background:#161616}
td{padding:8px 12px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
tr:hover{background:#1a1a1a}
button{padding:4px 12px;background:transparent;color:#00cc66;border:1px solid #00cc66;border-radius:3px;cursor:pointer;font-family:monospace;font-size:11px}
button:hover{background:rgba(0,255,136,.1)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;align-items:center;justify-content:center}
#modal.open{display:flex}
#modal-inner{background:#111;border:1px solid #333;border-radius:4px;padding:20px;max-width:92vw;max-height:90vh;overflow:auto;position:relative}
#modal-close{position:absolute;top:10px;right:12px;background:none;border:none;color:#888;font-size:16px;cursor:pointer}
#modal-close:hover{color:#ff4444}
#modal-img{max-width:100%;max-height:70vh;display:block;margin:8px auto}
.empty{text-align:center;padding:40px;color:#444}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh}
#login-box{background:#161616;border:1px solid #333;border-radius:4px;padding:32px;width:280px;text-align:center}
#login-box h2{color:#00ff88;margin-bottom:20px;font-size:16px}
#login-box input{width:100%;margin-bottom:12px}
#login-box button{width:100%;padding:10px;background:transparent;color:#00ff88;border:1px solid #00ff88;border-radius:3px;cursor:pointer;font-family:monospace;letter-spacing:1px}
#err{color:#ff4444;font-size:11px;min-height:14px;margin-top:6px}
</style>
</head>
<body>

<div id="login">
  <div id="login-box">
    <h2>COMPROVANTES</h2>
    <input type="password" id="pwd" placeholder="senha" />
    <button onclick="doLogin()">ENTRAR</button>
    <p id="err"></p>
  </div>
</div>

<div id="app" style="display:none">
  <h1>Comprovantes</h1>
  <input type="text" id="search" placeholder="buscar nome ou CPF..." oninput="filter()" />
  <table>
    <thead><tr><th>Data</th><th>Nome</th><th>CPF</th><th>Arquivo</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="4" class="empty">carregando...</td></tr></tbody>
  </table>
</div>

<div id="modal" onclick="if(event.target===this)close()">
  <div id="modal-inner">
    <button id="modal-close" onclick="close()">✕ fechar</button>
    <img id="modal-img" src="" alt="comprovante" />
  </div>
</div>

<script>
const SB_URL = 'https://ldyhodwdhavrgyooukpi.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkeWhvZHdkaGF2cmd5b291a3BpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjQxMDUyNCwiZXhwIjoyMTAxOTg2NTI0fQ.JvEtOi46gaL5fAFk8XnUUeEyPTibpC79NwPGMF8SvdY';
const PASS = 'comp2025@';
let all = [];

document.getElementById('pwd').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogin() {
  if (document.getElementById('pwd').value === PASS) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    load();
  } else {
    document.getElementById('err').textContent = 'senha incorreta';
  }
}

async function load() {
  const r = await fetch(`${SB_URL}/rest/v1/comprovantes?order=created_at.desc&limit=500`, {
    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
  });
  all = await r.json();
  render(all);
}

function fmt(d) { if(!d) return '-'; return new Date(d).toLocaleString('pt-BR'); }
function fmtCpf(c) { if(!c) return '-'; return c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); }

function render(data) {
  const tbody = document.getElementById('tbody');
  if (!data.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty">nenhum comprovante</td></tr>'; return; }
  tbody.innerHTML = data.map((c, i) => `<tr>
    <td style="color:#666;white-space:nowrap">${fmt(c.created_at)}</td>
    <td>${c.nome || '-'}</td>
    <td style="font-family:monospace">${fmtCpf(c.cpf)}</td>
    <td>${c.arquivo ? `<button onclick="view(${i})">VER</button>` : '-'}</td>
  </tr>`).join('');
}

function filter() {
  const q = document.getElementById('search').value.toLowerCase();
  render(all.filter(c => (c.nome||'').toLowerCase().includes(q) || (c.cpf||'').includes(q)));
}

function view(i) {
  const src = all[i].arquivo;
  if (!src) return;
  const img = document.getElementById('modal-img');
  img.src = src.startsWith('data:') || src.startsWith('http') ? src : 'data:image/png;base64,' + src;
  document.getElementById('modal').classList.add('open');
}

function close() { document.getElementById('modal').classList.remove('open'); }
</script>
</body>
</html>
